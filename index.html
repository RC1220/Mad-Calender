<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Incident Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --danger: #ff4757;
      --danger-glow: rgba(255, 71, 87, 0.4);
      --accent-glow: rgba(99, 102, 241, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 60px var(--accent-glow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
    }

    .badge-dot.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-bar h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      transition: all 0.2s ease;
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.12);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 12px;
    }

    .weekdays div {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .day-cell:not(.empty):active {
      transform: scale(0.85);
    }

    .day-cell.empty {
      background: transparent;
      cursor: default;
    }

    .day-cell.today {
      border-color: var(--primary);
      color: #a5b4fc;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .day-cell.mad {
      background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 6px 16px var(--danger-glow);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); }
      100% { transform: scale(1); }
    }

    .stats-card {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--danger);
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Shared Tracker</h1>
      <div class="badge">
        <div class="badge-dot" id="statusDot"></div>
        <span id="statusText">Syncing...</span>
      </div>
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <h2 id="monthYear"></h2>
      <button class="nav-btn" id="nextMonth">&gt;</button>
    </div>

    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>

    <div class="stats-card">
      <div>
        <div class="stat-num" id="totalIncidents">0</div>
        <div class="stat-label">Total Days</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAe5auugKdM0dftt2itYKmar35zN0c9_As",
      authDomain: "calendar-9c187.firebaseapp.com",
      projectId: "calendar-9c187",
      storageBucket: "calendar-9c187.firebasestorage.app",
      messagingSenderId: "503457410166",
      appId: "1:503457410166:web:f5360d583a7d139499c357",
      measurementId: "G-XQQD4P5G9N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentDate = new Date();
    const madDates = new Set();

    onSnapshot(collection(db, "mad_days"), (snapshot) => {
      madDates.clear();
      snapshot.forEach(doc => madDates.add(doc.id));
      
      document.getElementById('statusText').innerText = "Live";
      document.getElementById('statusDot').classList.add('active');
      document.getElementById('totalIncidents').innerText = madDates.size;
      
      renderCalendar();
    }, (error) => {
      document.getElementById('statusText').innerText = "Offline";
      document.getElementById('statusDot').classList.remove('active');
      console.error(error);
    });

    async function toggleDate(dateStr) {
      const docRef = doc(db, "mad_days", dateStr);
      if (madDates.has(dateStr)) {
        await deleteDoc(docRef);
      } else {
        await setDoc(docRef, { date: dateStr, loggedAt: new Date() });
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('monthYear').innerText = `${monthNames[month]} ${year}`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      
      const daysGrid = document.getElementById('daysGrid');
      daysGrid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day-cell empty';
        daysGrid.appendChild(emptyDiv);
      }

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      for (let day = 1; day <= lastDate; day++) {
        const dayDiv = document.createElement('div');
        const formattedMonth = String(month + 1).padStart(2, '0');
        const formattedDay = String(day).padStart(2, '0');
        const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

        dayDiv.className = 'day-cell';
        dayDiv.innerText = day;

        if (dateStr === todayStr) dayDiv.classList.add('today');
        if (madDates.has(dateStr)) dayDiv.classList.add('mad');

        dayDiv.addEventListener('click', () => toggleDate(dateStr));
        daysGrid.appendChild(dayDiv);
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
