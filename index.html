<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Shared Day Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --red: #ff4757;
      --yellow: #ffa502;
      --green: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
    }

    .badge-dot.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    /* Color Selection Buttons */
    .color-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .color-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 14px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .color-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .color-btn[data-color="red"] .dot { background: var(--red); }
    .color-btn[data-color="yellow"] .dot { background: var(--yellow); }
    .color-btn[data-color="green"] .dot { background: var(--green); }

    .color-btn.active[data-color="red"] {
      border-color: var(--red);
      background: rgba(255, 71, 87, 0.15);
      color: #fff;
    }

    .color-btn.active[data-color="yellow"] {
      border-color: var(--yellow);
      background: rgba(255, 165, 2, 0.15);
      color: #fff;
    }

    .color-btn.active[data-color="green"] {
      border-color: var(--green);
      background: rgba(46, 213, 115, 0.15);
      color: #fff;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .nav-bar h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 10px;
    }

    .weekdays div {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.today { border-color: var(--primary); color: #a5b4fc; }

    .day-cell.red {
      background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
    }

    .day-cell.yellow {
      background: linear-gradient(135deg, #ffa502 0%, #eccc68 100%);
      color: #000;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 165, 2, 0.3);
    }

    .day-cell.green {
      background: linear-gradient(135deg, #2ed573 0%, #2bcbba 100%);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3);
    }

    /* Bottom Stats Section */
    .stats-card {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row:first-child {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .stat-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-pills {
      display: flex;
      gap: 8px;
    }

    .pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pill.red { background: rgba(255, 71, 87, 0.2); color: #ff6b81; }
    .pill.yellow { background: rgba(255, 165, 2, 0.2); color: #ffa502; }
    .pill.green { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Shared Tracker</h1>
      <div class="badge">
        <div class="badge-dot" id="statusDot"></div>
        <span id="statusText">Syncing...</span>
      </div>
    </div>

    <!-- Active Color Selector Buttons -->
    <div class="color-selector">
      <button class="color-btn active" data-color="red">
        <span class="dot"></span> Red
      </button>
      <button class="color-btn" data-color="yellow">
        <span class="dot"></span> Yellow
      </button>
      <button class="color-btn" data-color="green">
        <span class="dot"></span> Green
      </button>
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <h2 id="monthYear"></h2>
      <button class="nav-btn" id="nextMonth">&gt;</button>
    </div>

    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>

    <!-- Bottom Statistics -->
    <div class="stats-card">
      <div class="stat-row">
        <span class="stat-title">Year to Date</span>
        <div class="stat-pills">
          <span class="pill red" id="ytdRed">🔴 0</span>
          <span class="pill yellow" id="ytdYellow">🟡 0</span>
          <span class="pill green" id="ytdGreen">🟢 0</span>
        </div>
      </div>
      <div class="stat-row">
        <span class="stat-title">Month to Date</span>
        <div class="stat-pills">
          <span class="pill red" id="mtdRed">🔴 0</span>
          <span class="pill yellow" id="mtdYellow">🟡 0</span>
          <span class="pill green" id="mtdGreen">🟢 0</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAe5auugKdM0dftt2itYKmar35zN0c9_As",
      authDomain: "calendar-9c187.firebaseapp.com",
      projectId: "calendar-9c187",
      storageBucket: "calendar-9c187.firebasestorage.app",
      messagingSenderId: "503457410166",
      appId: "1:503457410166:web:f5360d583a7d139499c357",
      measurementId: "G-XQQD4P5G9N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentDate = new Date();
    const dayData = new Map();
    let activeColor = 'red';

    // Color Selector Switcher
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeColor = btn.dataset.color;
      });
    });

    // Realtime Database Listener
    onSnapshot(collection(db, "mad_days"), (snapshot) => {
      dayData.clear();
      snapshot.forEach(doc => {
        const data = doc.data();
        dayData.set(doc.id, data.color || 'red');
      });
      
      document.getElementById('statusText').innerText = "Live";
      document.getElementById('statusDot').classList.add('active');
      
      updateStats();
      renderCalendar();
    }, (error) => {
      document.getElementById('statusText').innerText = "Offline";
      document.getElementById('statusDot').classList.remove('active');
      console.error(error);
    });

    async function toggleDate(dateStr) {
      const docRef = doc(db, "mad_days", dateStr);
      const currentColor = dayData.get(dateStr);

      if (currentColor === activeColor) {
        await deleteDoc(docRef);
      } else {
        await setDoc(docRef, { date: dateStr, color: activeColor, loggedAt: new Date() });
      }
    }

    function updateStats() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const todayStr = `${currentYear}-${currentMonth}-${String(now.getDate()).padStart(2, '0')}`;

      let ytd = { red: 0, yellow: 0, green: 0 };
      let mtd = { red: 0, yellow: 0, green: 0 };

      dayData.forEach((color, dateStr) => {
        const [y, m] = dateStr.split('-');
        if (parseInt(y) === currentYear && dateStr <= todayStr) {
          if (ytd[color] !== undefined) ytd[color]++;
          if (m === currentMonth) {
            if (mtd[color] !== undefined) mtd[color]++;
          }
        }
      });

      document.getElementById('ytdRed').innerText = `🔴 ${ytd.red}`;
      document.getElementById('ytdYellow').innerText = `🟡 ${ytd.yellow}`;
      document.getElementById('ytdGreen').innerText = `🟢 ${ytd.green}`;

      document.getElementById('mtdRed').innerText = `🔴 ${mtd.red}`;
      document.getElementById('mtdYellow').innerText = `🟡 ${mtd.yellow}`;
      document.getElementById('mtdGreen').innerText = `🟢 ${mtd.green}`;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('monthYear').innerText = `${monthNames[month]} ${year}`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      
      const daysGrid = document.getElementById('daysGrid');
      daysGrid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day-cell empty';
        daysGrid.appendChild(emptyDiv);
      }

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      for (let day = 1; day <= lastDate; day++) {
        const dayDiv = document.createElement('div');
        const formattedMonth = String(month + 1).padStart(2, '0');
        const formattedDay = String(day).padStart(2, '0');
        const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

        dayDiv.className = 'day-cell';
        dayDiv.innerText = day;

        if (dateStr === todayStr) dayDiv.classList.add('today');

        const color = dayData.get(dateStr);
        if (color) dayDiv.classList.add(color);

        dayDiv.addEventListener('click', () => toggleDate(dateStr));
        daysGrid.appendChild(dayDiv);
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
